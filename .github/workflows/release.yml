name: Sign & release

# Builds the extension, signs it as an unlisted add-on via Mozilla AMO, and
# attaches the installable .xpi to a GitHub Release.
# Requires repo secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
# (from https://addons.mozilla.org/developers/addon/api/key/).

on:
  push:
    tags: ['v*']
  # Dispatch can also cut a release, given the tag to cut. This exists because
  # not every environment that can push a branch can push a tag — a scoped
  # credential often allows refs/heads and refuses refs/tags — and without it
  # the only way to release is from a machine with full tag rights.
  # softprops/action-gh-release creates the tag if it does not exist yet.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.5.0. Created if it does not exist. Leave empty to release the current ref.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Sign (unlisted) via AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign
          --source-dir .output/firefox-mv2
          --artifacts-dir web-ext-artifacts
          --channel unlisted

      - name: Attach .xpi to the release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push github.ref_name IS the tag, so the fallback keeps the
          # original trigger behaving exactly as before.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: web-ext-artifacts/*.xpi
          fail_on_unmatched_files: true
